<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cyberia Token Charts</title>

<style>
    :root {
        --green: #00ff9c;
        --green-soft: rgba(0, 255, 156, 0.12);
        --green-dim: rgba(0, 255, 156, 0.38);
        --cyan: #5ee7ff;
        --cyan-soft: rgba(94, 231, 255, 0.12);
        --cyan-dim: rgba(94, 231, 255, 0.38);
        --red: #ff4d6d;
        --red-soft: rgba(255, 77, 109, 0.12);
        --yellow: #ffd166;
        --white: #ffffff;
        --muted: rgba(255, 255, 255, 0.64);
        --faint: rgba(255, 255, 255, 0.09);
    }

    body {
        margin: 0;
        background: rgba(0, 0, 0, 0);
        color: var(--cyan);
        font-family: monospace;
        overflow: hidden;
    }

    .panel {
        position: absolute;
        top: 12px;
        left: 12px;
        width: 560px;
        max-height: calc(100vh - 24px);
        overflow-y: auto;
        padding: 9px;
        background: rgba(0, 0, 0, 0.76);
        border: 1px solid var(--cyan-dim);
        box-shadow: 0 0 14px rgba(94, 231, 255, 0.2);
        box-sizing: border-box;
    }

    .header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 7px;
        padding-bottom: 6px;
        border-bottom: 1px solid var(--faint);
    }

    .title {
        color: var(--white);
        font-size: 12px;
        font-weight: bold;
        letter-spacing: 1px;
    }

    .subtitle {
        margin-top: 3px;
        color: var(--muted);
        font-size: 8px;
        line-height: 1.25;
    }

    .status {
        min-width: 118px;
        color: var(--muted);
        font-size: 8px;
        line-height: 1.35;
        text-align: right;
    }

    .status strong {
        color: var(--white);
        font-weight: normal;
    }

    .grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 5px;
    }

    .card {
        min-height: 92px;
        padding: 5px;
        background: rgba(255, 255, 255, 0.035);
        border: 1px solid var(--faint);
        box-sizing: border-box;
    }

    .card.live {
        background: var(--cyan-soft);
        border-color: rgba(94, 231, 255, 0.18);
    }

    .card.down {
        background: var(--red-soft);
        border-color: rgba(255, 77, 109, 0.2);
    }

    .card-head {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 5px;
        align-items: start;
        margin-bottom: 4px;
    }

    .symbol {
        color: var(--white);
        font-size: 10px;
        font-weight: bold;
        line-height: 1.1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .price {
        margin-top: 2px;
        color: var(--white);
        font-size: 10px;
        line-height: 1.2;
        overflow-wrap: anywhere;
    }

    .change {
        min-width: 46px;
        padding: 3px 4px;
        border: 1px solid currentColor;
        font-size: 8px;
        line-height: 1;
        text-align: center;
        box-sizing: border-box;
        white-space: nowrap;
    }

    .chart {
        position: relative;
        height: 34px;
        margin: 4px 0;
        border: 1px solid rgba(255, 255, 255, 0.06);
        background:
            linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
        background-size: 100% 50%, 25% 100%;
    }

    canvas {
        display: block;
        width: 100%;
        height: 100%;
    }

    .meta {
        display: flex;
        justify-content: space-between;
        gap: 4px;
        color: var(--muted);
        font-size: 8px;
        line-height: 1.15;
    }

    .meta span {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .meta span:last-child {
        color: var(--white);
        text-align: right;
        flex-shrink: 0;
    }

    .ok {
        color: var(--green);
    }

    .warn {
        color: var(--cyan);
    }

    .bad {
        color: var(--red);
    }

    @media (max-width: 600px) {
        .panel {
            right: 8px;
            left: 8px;
            width: auto;
        }

        .grid {
            grid-template-columns: repeat(3, minmax(0, 1fr));
        }
    }
</style>
</head>

<body>

<div class="panel">
    <div class="header">
        <div>
            <div class="title">CYBERIA TOKEN CHARTS</div>
            <div class="subtitle">On-chain LP reserve history, USD anchored.</div>
        </div>
        <div class="status">
            <div>Status: <strong id="feedStatus">BOOT</strong></div>
            <div>Updated: <strong id="updatedAt">--:--:--</strong></div>
            <div>Samples: <strong id="sampleCount">--</strong></div>
        </div>
    </div>

    <div class="grid" id="tokenGrid"></div>
</div>

<script>
const CONFIG = {
    rpcUrl: "https://rpc.cyberia.church",
    pollMs: 12000,
    maxSamples: 180,
    historyBlocks: 1000000,
    historySamples: 72,
    rpcBatchSize: 20
};

const TOKENS = [
    { symbol: "CYBER", address: "0x78272aAd03E4b9d7A9134e874BA6d419B534F6c9", decimals: 18 },
    { symbol: "ASH", address: "0x992Fca0a89DD95afb17751f6CC233Adb9B089df5", decimals: 18 },
    { symbol: "LTC", address: "0x001AFD19C9d890b0cf0fcd6D654f9BFe4f264F14", decimals: 8 },
    { symbol: "LAIN", address: "0x05cd1AFd5b2DF3CCA6cEAb80CbC21168ec981E8B", decimals: 18 },
    { symbol: "MINE", address: "0xD8c1f812ADd03ccdE8D3c7F86FeAD181980CD7Ec", decimals: 18 },
    { symbol: "GOAL", address: "0xEb91EC10462a249b9922D6D62FB2BE73Bd084ADe", decimals: 18 },
    { symbol: "HATCHER", address: "0x621021F18b6404123f98b1395c418868418ACF36", decimals: 9 },
    { symbol: "KRSQ", address: "0x4945419ccEEF0Dc70B054700DE2750A056B03eE3", decimals: 18 },
    { symbol: "YTN", address: "0x3a5820Be90c3fB9c5F3Fb47a4859544193B0f8C6", decimals: 18 },
    { symbol: "SOL", address: "0x53450B1d205f1e41d10B653FBBDEa74160dafFf4", decimals: 9 },
    { symbol: "BTC", address: "0x9332081f308BC978fe259237850fA253131b46Fa", decimals: 8 },
    { symbol: "ETH", address: "0xFDa2F6EEB11f1aCc7ccAb559133E8F07d9F81986", decimals: 18 }
];

const ANCHORS = {
    "0xdc25597b19799010047f17e9591efe08efd40077": 1,
    "0x94845af24a3e431593a2b941b2b31836de45185d": 1
};

const PAIRS = [
    { label: "CYBER/USDC", address: "0x79B039b5E146E878683039D9387E212afc9FFC85" },
    { label: "CYBER/USDT", address: "0x07b935a3Ba330Cb3Bd56B43F1032b57d3Ae0e04f" },
    { label: "ASH/CYBER", address: "0xB3b6d8f38beC836e5629848223f1848A324188f0" },
    { label: "LTC/CYBER", address: "0x1DF2329f6b9E94f9fdB5D76ea006DffF70C378Ec" },
    { label: "CYBER/LAIN", address: "0x9298d13f57D1e5bD14C443144b500aaa210a1175" },
    { label: "CYBER/MINE", address: "0xF18bA050eFF63B2be2D244A423691D44BDDeF60d" },
    { label: "MINE/LAIN", address: "0x86199CD222E0d3412b77323772B4D1cFd0a35242" },
    { label: "CYBER/GOAL", address: "0x7598B5A2421E7A9cA443368DB939Ec860Dc9d536" },
    { label: "CYBER/HATCHER", address: "0x2AC6779E02ED515360a984A52441ba77fa7e3cAB" },
    { label: "KRSQ/CYBER", address: "0x828b0c5D46CfDf4Adc78E2cB4139547aca56845c" },
    { label: "YTN/CYBER", address: "0xda176FEd5D6D1e1eB8C37556A01678f9e18B941F" },
    { label: "CYBER/SOL", address: "0x15cB7289af5293ca4BeFB368Bde50D441B95b1E6" },
    { label: "CYBER/BTC", address: "0x144211C1476e1Da2eD55B19ff25d1ea18AA75aBC" },
    { label: "CYBER/ETH", address: "0x64252D0d9D9d2f27146c01CA15dD8680ACFFdEa2" },
    { label: "BTC/ETH", address: "0x28521507A465Da62B73348C9FBB5561cCB1f311c" }
];

const SELECTORS = {
    token0: "0x0dfe1681",
    token1: "0xd21220a7",
    getReserves: "0x0902f1ac"
};

const tokenByAddress = {};
const state = {
    pairMeta: {},
    cards: {},
    samples: {},
    loadingMeta: null,
    historyLoaded: false,
    refreshId: 0
};

TOKENS.forEach((token) => {
    token.key = token.address.toLowerCase();
    tokenByAddress[token.key] = token;
});

Object.keys(ANCHORS).forEach((address) => {
    tokenByAddress[address] = {
        symbol: address === "0xdc25597b19799010047f17e9591efe08efd40077" ? "USDC" : "USDT",
        address,
        key: address,
        decimals: 6
    };
});

function byId(id) {
    return document.getElementById(id);
}

function rpc(method, params) {
    return fetch(CONFIG.rpcUrl, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({
            jsonrpc: "2.0",
            id: ++state.refreshId,
            method,
            params
        })
    }).then((response) => {
        if (!response.ok) {
            throw new Error("HTTP " + response.status);
        }

        return response.json();
    }).then((payload) => {
        if (payload.error) {
            throw new Error(payload.error.message || "RPC error");
        }

        return payload.result;
    });
}

function rpcBatch(calls) {
    if (calls.length === 0) {
        return Promise.resolve([]);
    }

    const payload = calls.map((call) => ({
        jsonrpc: "2.0",
        id: ++state.refreshId,
        method: call.method,
        params: call.params
    }));

    return fetch(CONFIG.rpcUrl, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify(payload)
    }).then((response) => {
        if (!response.ok) {
            throw new Error("HTTP " + response.status);
        }

        return response.json();
    }).then((batch) => {
        if (!Array.isArray(batch)) {
            throw new Error((batch.error && batch.error.message) || "Batch RPC error");
        }

        const byId = {};
        batch.forEach((item) => {
            byId[item.id] = item;
        });

        return payload.map((request) => {
            const item = byId[request.id];

            if (!item || item.error) {
                return null;
            }

            return item.result;
        });
    });
}

async function batchEthCalls(calls) {
    const results = [];

    for (let index = 0; index < calls.length; index += CONFIG.rpcBatchSize) {
        const chunk = calls.slice(index, index + CONFIG.rpcBatchSize);
        const chunkResults = await rpcBatch(chunk.map((call) => ({
            method: "eth_call",
            params: [{ to: call.to, data: call.data }, call.blockTag || "latest"]
        })));

        results.push.apply(results, chunkResults);
    }

    return results;
}

function ethCall(to, data, blockTag) {
    return rpc("eth_call", [{ to, data }, blockTag || "latest"]);
}

function blockTag(blockNumber) {
    return "0x" + blockNumber.toString(16);
}

function decodeAddress(result) {
    return "0x" + result.slice(-40).toLowerCase();
}

function decodeUint(result, index) {
    const start = 2 + index * 64;
    return BigInt("0x" + result.slice(start, start + 64));
}

function normalizedReserve(raw, decimals) {
    const divisor = 10 ** decimals;
    return Number(raw) / divisor;
}

function isCallResult(result, words) {
    return typeof result === "string" && result.length >= 2 + words * 64;
}

function formatUsd(value) {
    if (!Number.isFinite(value)) {
        return "--";
    }

    if (value >= 1000) {
        return "$" + new Intl.NumberFormat("en-US", {
            notation: "compact",
            maximumFractionDigits: 2
        }).format(value);
    }

    if (value >= 1) {
        return "$" + value.toLocaleString("en-US", {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        });
    }

    if (value >= 0.01) {
        return "$" + value.toLocaleString("en-US", {
            minimumFractionDigits: 4,
            maximumFractionDigits: 4
        });
    }

    if (value >= 0.0001) {
        return "$" + value.toLocaleString("en-US", {
            minimumFractionDigits: 6,
            maximumFractionDigits: 6
        });
    }

    return "$" + value.toPrecision(4);
}

function formatChange(value) {
    if (!Number.isFinite(value)) {
        return "--";
    }

    return (value > 0 ? "+" : "") + value.toFixed(2) + "%";
}

function formatTime() {
    return new Date().toLocaleTimeString("en-US", { hour12: false });
}

function setFeedStatus(text, className) {
    const el = byId("feedStatus");
    el.textContent = text;
    el.className = className || "";
}

function ensureCards() {
    const grid = byId("tokenGrid");
    grid.innerHTML = "";

    TOKENS.forEach((token) => {
        const card = document.createElement("div");
        const safeKey = token.key.replace(/[^a-z0-9]/g, "");
        card.className = "card";
        card.innerHTML =
            '<div class="card-head">' +
                '<div>' +
                    '<div class="symbol">' + token.symbol + '</div>' +
                    '<div class="price" id="price-' + safeKey + '">--</div>' +
                '</div>' +
                '<div class="change warn" id="change-' + safeKey + '">--</div>' +
            '</div>' +
            '<div class="chart"><canvas id="chart-' + safeKey + '"></canvas></div>' +
            '<div class="meta"><span id="source-' + safeKey + '">waiting</span><span id="range-' + safeKey + '">--</span></div>';
        grid.appendChild(card);

        state.cards[token.key] = {
            root: card,
            price: byId("price-" + safeKey),
            change: byId("change-" + safeKey),
            source: byId("source-" + safeKey),
            range: byId("range-" + safeKey),
            canvas: byId("chart-" + safeKey)
        };
        state.samples[token.key] = [];
    });
}

async function loadPairMeta() {
    if (!state.loadingMeta) {
        state.loadingMeta = (async () => {
            const calls = [];

            PAIRS.forEach((pair) => {
                calls.push({ pair, to: pair.address, data: SELECTORS.token0 });
                calls.push({ pair, to: pair.address, data: SELECTORS.token1 });
            });

            const results = await batchEthCalls(calls);

            for (let index = 0; index < calls.length; index += 2) {
                const pair = calls[index].pair;
                const token0Result = results[index];
                const token1Result = results[index + 1];

                if (!isCallResult(token0Result, 1) || !isCallResult(token1Result, 1)) {
                    continue;
                }

                state.pairMeta[pair.address.toLowerCase()] = {
                    label: pair.label,
                    address: pair.address,
                    token0: decodeAddress(token0Result),
                    token1: decodeAddress(token1Result)
                };
            }
        })();
    }

    return state.loadingMeta;
}

function decodePairReserves(pair, reservesResult) {
    const meta = state.pairMeta[pair.address.toLowerCase()];

    if (!meta || !isCallResult(reservesResult, 3)) {
        return null;
    }

    const token0 = tokenByAddress[meta.token0];
    const token1 = tokenByAddress[meta.token1];

    if (!token0 || !token1) {
        return null;
    }

    const reserve0 = decodeUint(reservesResult, 0);
    const reserve1 = decodeUint(reservesResult, 1);

    if (reserve0 <= 0n || reserve1 <= 0n) {
        return null;
    }

    return {
        label: meta.label,
        token0: meta.token0,
        token1: meta.token1,
        reserve0: normalizedReserve(reserve0, token0.decimals),
        reserve1: normalizedReserve(reserve1, token1.decimals)
    };
}

async function loadReserves(blockNumber) {
    await loadPairMeta();

    const tag = Number.isFinite(blockNumber) ? blockTag(blockNumber) : "latest";
    const results = await batchEthCalls(PAIRS.map((pair) => ({
        pair,
        to: pair.address,
        data: SELECTORS.getReserves,
        blockTag: tag
    })));

    return results.map((result, index) => decodePairReserves(PAIRS[index], result)).filter(Boolean);
}

async function loadLatestReserves() {
    const latestBlock = parseInt(await rpc("eth_blockNumber", []), 16);
    const pairs = await loadReserves(latestBlock);

    return { block: latestBlock, pairs };
}

function historyBlocks(latestBlock) {
    const count = Math.max(2, CONFIG.historySamples);
    const firstBlock = Math.max(1, latestBlock - CONFIG.historyBlocks);
    const span = latestBlock - firstBlock;
    const blocks = [];
    const seen = {};

    for (let index = 0; index < count; index += 1) {
        const block = firstBlock + Math.round((span * index) / (count - 1));

        if (!seen[block]) {
            blocks.push(block);
            seen[block] = true;
        }
    }

    return blocks;
}

async function loadReserveTimeline(blocks) {
    await loadPairMeta();

    const calls = [];
    blocks.forEach((blockNumber) => {
        PAIRS.forEach((pair) => {
            calls.push({
                block: blockNumber,
                pair,
                to: pair.address,
                data: SELECTORS.getReserves,
                blockTag: blockTag(blockNumber)
            });
        });
    });

    const results = await batchEthCalls(calls);
    const byBlock = {};

    results.forEach((result, index) => {
        const call = calls[index];
        const decoded = decodePairReserves(call.pair, result);

        if (!decoded) {
            return;
        }

        if (!byBlock[call.block]) {
            byBlock[call.block] = [];
        }

        byBlock[call.block].push(decoded);
    });

    return blocks.map((blockNumber) => ({
        block: blockNumber,
        pairs: byBlock[blockNumber] || []
    }));
}

function addCandidate(candidates, token, price, weight, source) {
    if (!Number.isFinite(price) || price <= 0) {
        return;
    }

    if (!candidates[token]) {
        candidates[token] = [];
    }

    candidates[token].push({
        price,
        weight: Number.isFinite(weight) && weight > 0 ? weight : 1,
        source
    });
}

function weighted(candidates) {
    let totalWeight = 0;
    let total = 0;
    let source = "";
    let bestWeight = -1;

    candidates.forEach((candidate) => {
        total += candidate.price * candidate.weight;
        totalWeight += candidate.weight;

        if (candidate.weight > bestWeight) {
            bestWeight = candidate.weight;
            source = candidate.source;
        }
    });

    return {
        price: total / totalWeight,
        source
    };
}

function derivePrices(pairs) {
    const prices = Object.assign({}, ANCHORS);
    const sources = {};

    for (let step = 0; step < 8; step += 1) {
        const candidates = {};

        pairs.forEach((pair) => {
            if (!(pair.reserve0 > 0) || !(pair.reserve1 > 0)) {
                return;
            }

            const price0 = prices[pair.token0];
            const price1 = prices[pair.token1];

            if (Number.isFinite(price0) && !Object.prototype.hasOwnProperty.call(ANCHORS, pair.token1)) {
                addCandidate(
                    candidates,
                    pair.token1,
                    (pair.reserve0 * price0) / pair.reserve1,
                    pair.reserve0 * price0,
                    pair.label
                );
            }

            if (Number.isFinite(price1) && !Object.prototype.hasOwnProperty.call(ANCHORS, pair.token0)) {
                addCandidate(
                    candidates,
                    pair.token0,
                    (pair.reserve1 * price1) / pair.reserve0,
                    pair.reserve1 * price1,
                    pair.label
                );
            }
        });

        let changed = false;
        Object.keys(candidates).forEach((token) => {
            if (!Number.isFinite(prices[token])) {
                const result = weighted(candidates[token]);
                prices[token] = result.price;
                sources[token] = result.source;
                changed = true;
            }
        });

        if (!changed) {
            break;
        }
    }

    return { prices, sources };
}

function updateSamples(token, price, sampleTime) {
    const samples = state.samples[token.key];
    const time = Number.isFinite(sampleTime) ? sampleTime : Date.now();

    if (samples.length === 0) {
        samples.push({ time: time - 1, price });
    } else if (time < samples[samples.length - 1].time) {
        return;
    } else if (time === samples[samples.length - 1].time) {
        samples[samples.length - 1].price = price;
        return;
    }

    samples.push({ time, price });

    while (samples.length > CONFIG.maxSamples) {
        samples.shift();
    }
}

function drawCard(token) {
    const samples = state.samples[token.key];
    const card = state.cards[token.key];
    const canvas = card.canvas;
    const context = canvas.getContext("2d");
    const rect = canvas.getBoundingClientRect();
    const ratio = window.devicePixelRatio || 1;
    const width = Math.max(1, Math.floor(rect.width));
    const height = Math.max(1, Math.floor(rect.height));

    canvas.width = Math.floor(width * ratio);
    canvas.height = Math.floor(height * ratio);
    context.setTransform(ratio, 0, 0, ratio, 0, 0);
    context.clearRect(0, 0, width, height);

    if (samples.length < 2) {
        return;
    }

    const prices = samples.map((sample) => sample.price);
    const minVisible = Math.min.apply(null, prices);
    const maxVisible = Math.max.apply(null, prices);
    const spread = maxVisible - minVisible;
    const pad = spread > 0 ? spread * 0.16 : Math.max(maxVisible * 0.006, 0.000001);
    const min = minVisible - pad;
    const max = maxVisible + pad;
    const range = max - min || 1;
    const left = 5;
    const right = width - 5;
    const top = 5;
    const bottom = height - 6;
    const graphWidth = right - left;
    const graphHeight = bottom - top;
    const firstTime = samples[0].time;
    const lastTime = samples[samples.length - 1].time;
    const timeRange = lastTime - firstTime || 1;
    const latest = samples[samples.length - 1];
    const previous = samples[samples.length - 2];
    const direction = Math.sign(latest.price - previous.price);
    const lineColor = direction > 0 ? "#00ff9c" : direction < 0 ? "#ff4d6d" : "#5ee7ff";
    const fillColor = direction > 0
        ? "rgba(0, 255, 156, 0.14)"
        : direction < 0
            ? "rgba(255, 77, 109, 0.14)"
            : "rgba(94, 231, 255, 0.14)";

    function xFor(sample) {
        return left + ((sample.time - firstTime) / timeRange) * graphWidth;
    }

    function yFor(price) {
        return top + ((max - price) / range) * graphHeight;
    }

    context.beginPath();
    samples.forEach((sample, index) => {
        const x = xFor(sample);
        const y = yFor(sample.price);

        if (index === 0) {
            context.moveTo(x, y);
        } else {
            context.lineTo(x, y);
        }
    });
    context.lineTo(xFor(latest), bottom);
    context.lineTo(xFor(samples[0]), bottom);
    context.closePath();
    context.fillStyle = fillColor;
    context.fill();

    context.beginPath();
    samples.forEach((sample, index) => {
        const x = xFor(sample);
        const y = yFor(sample.price);

        if (index === 0) {
            context.moveTo(x, y);
        } else {
            context.lineTo(x, y);
        }
    });
    context.strokeStyle = lineColor;
    context.lineWidth = 2;
    context.stroke();

    context.beginPath();
    context.arc(xFor(latest), yFor(latest.price), 2.5, 0, Math.PI * 2);
    context.fillStyle = lineColor;
    context.fill();

    card.range.textContent = formatUsd(minVisible) + " - " + formatUsd(maxVisible);
}

async function backfillHistory() {
    if (state.historyLoaded) {
        return;
    }

    setFeedStatus("HISTORY", "warn");

    const latestBlock = parseInt(await rpc("eth_blockNumber", []), 16);
    const timeline = await loadReserveTimeline(historyBlocks(latestBlock));

    timeline.forEach((entry) => {
        if (entry.pairs.length === 0) {
            return;
        }

        const priceState = derivePrices(entry.pairs);

        TOKENS.forEach((token) => {
            const price = priceState.prices[token.key];

            if (Number.isFinite(price)) {
                updateSamples(token, price, entry.block);
            }
        });
    });

    state.historyLoaded = true;
}

function renderPrices(priceState, sampleTime) {
    TOKENS.forEach((token) => {
        const price = priceState.prices[token.key];
        const card = state.cards[token.key];

        if (!Number.isFinite(price)) {
            card.root.className = "card down";
            card.price.textContent = "--";
            card.change.textContent = "--";
            card.change.className = "change bad";
            card.source.textContent = "no route";
            return;
        }

        updateSamples(token, price, sampleTime);

        const samples = state.samples[token.key];
        const first = samples[0];
        const change = first ? ((price - first.price) / first.price) * 100 : 0;
        const className = change > 0 ? "ok" : change < 0 ? "bad" : "warn";

        card.root.className = "card live";
        card.price.textContent = formatUsd(price);
        card.change.textContent = formatChange(change);
        card.change.className = "change " + className;
        card.source.textContent = priceState.sources[token.key] || "anchor";
        drawCard(token);
    });

    const firstToken = TOKENS[0];
    const count = state.samples[firstToken.key] ? state.samples[firstToken.key].length : 0;
    byId("sampleCount").textContent = String(count);
}

async function refresh() {
    try {
        setFeedStatus("SYNCING", "warn");
        await backfillHistory();

        const latest = await loadLatestReserves();
        renderPrices(derivePrices(latest.pairs), latest.block);
        byId("updatedAt").textContent = formatTime();
        setFeedStatus("LIVE", "ok");
    } catch (error) {
        setFeedStatus("ERROR", "bad");
        byId("updatedAt").textContent = error.message;
    }
}

ensureCards();
refresh();
setInterval(refresh, CONFIG.pollMs);
window.addEventListener("resize", () => TOKENS.forEach(drawCard));
</script>
