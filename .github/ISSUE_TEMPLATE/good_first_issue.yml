name: Good first issue
description: Small scoped task suitable for a first contribution.
title: "[Good first issue]: "
labels:
  - good first issue
  - help wanted
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user-visible or maintainer-visible problem should this solve?
      placeholder: The current page/script/docs section does not...
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Suggested scope
      description: Keep this narrow enough for a first PR.
      placeholder: Update X, add a focused test, avoid changing Y.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: Which command or manual check proves this is done?
      placeholder: cd backend/laravel && php artisan test --compact
    validations:
      required: true
