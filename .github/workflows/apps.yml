name: Apps

# Builds the native shells that wrap cyberia.church: the desktop app
# (frontend/desktop) for Linux, Windows, and macOS, and the Android app
# (frontend/mobile). Windows and macOS installers cannot be produced from a
# Linux workstation, which is what this workflow is for.
#
# Run it from the Actions tab, or push a tag: `git tag app-v1.0.0 && git push --tags`.

on:
  workflow_dispatch:
  push:
    tags:
      - 'app-v*'

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: dist:linux
            artifacts: |
              frontend/desktop/dist/*.AppImage
              frontend/desktop/dist/*.deb
          - os: windows-latest
            script: dist:win
            artifacts: frontend/desktop/dist/*.exe
          - os: macos-latest
            script: dist:mac
            artifacts: |
              frontend/desktop/dist/*.dmg
              frontend/desktop/dist/*.zip

    defaults:
      run:
        working-directory: frontend/desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npm test

      - name: Build installers
        run: npm run ${{ matrix.script }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: cyberia-desktop-${{ matrix.os }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  android:
    name: Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/mobile/package-lock.json

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npm test

      - name: Sync web assets
        run: npm run sync:android

      # Unsigned: publishing to Play additionally needs a keystore and the
      # signingConfigs block described in frontend/mobile/README.md.
      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: frontend/mobile/android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cyberia-android
          path: frontend/mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
