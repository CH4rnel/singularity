name: Compute images

# Builds every catalog service that has a Dockerfile in this repo, pushes it
# to GHCR, and renders its compute manifest against the pushed digest — the
# manifest and spec hash a CyberiaCompute lease (or a ServiceTreasury
# updateSpec) then commits to. Pull requests build without pushing.

on:
  pull_request:
    paths:
      - services/compute-agent/**
      - services/cyberia-dns/**
      - services/telegram-bot/**
      - frontend/landing/**
      - frontend/jekyll/**
  push:
    branches: [master]
    paths:
      - services/compute-agent/**
      - services/cyberia-dns/**
      - services/telegram-bot/**
      - frontend/landing/**
      - frontend/jekyll/**
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  agent-tests:
    name: Compute agent tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/compute-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  image:
    name: ${{ matrix.service }}
    needs: agent-tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: landing, context: frontend/landing, image: landing }
          - { service: blog, context: frontend/jekyll, image: blog }
          - { service: cyberia-dns, context: services/cyberia-dns, image: cyberia-dns }
          - { service: telegram-bot, context: services/telegram-bot, image: telegram-bot }
          - { service: compute-agent, context: services/compute-agent, image: compute-agent }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
      - name: Render manifest
        if: github.event_name != 'pull_request' && matrix.service != 'compute-agent'
        working-directory: services/compute-agent
        run: |
          npm ci --omit=dev
          node src/agent.mjs --manifest "${{ matrix.service }}" "${{ steps.build.outputs.digest }}" > "manifest-${{ matrix.service }}.json"
          cat "manifest-${{ matrix.service }}.json" >> "$GITHUB_STEP_SUMMARY"
      - if: github.event_name != 'pull_request' && matrix.service != 'compute-agent'
        uses: actions/upload-artifact@v4
        with:
          name: manifest-${{ matrix.service }}
          path: services/compute-agent/manifest-${{ matrix.service }}.json
