name: SDK lint

on:
  push:
    paths:
      - "game/SDK/**"
  pull_request:
    paths:
      - "game/SDK/**"

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game/SDK
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: game/SDK/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
