# A Cyberia compute provider: one agent per host.
#
#   cp .env.example .env    # COMPUTE_ADDRESS, COMPUTE_PROVIDER_KEY, …
#   docker compose up -d
#
# `watcher` is the payer's half and runs somewhere else — wherever the
# service's guardian key lives — so it is a profile, off by default.

x-logging: &logging
  driver: "json-file"
  options:
    max-size: "20m"
    max-file: "3"
    compress: "true"

services:
  agent:
    build: .
    container_name: cyberia-compute-agent
    logging: *logging
    restart: unless-stopped
    env_file:
      - path: .env
        required: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  watcher:
    build: .
    container_name: cyberia-compute-watcher
    profiles: ["watcher"]
    logging: *logging
    restart: unless-stopped
    command: ["--watch"]
    env_file:
      - path: .env.watcher
        required: true
