version: '3.9'

services:
  redis-db:
    extends:
      file: ./services/redis.yml
      service: redis-db

  db-init:
    extends:
      file: ./services/db.yml
      service: db-init

  db:
    depends_on:
      db-init:
        condition: service_completed_successfully
    extends:
      file: ./services/db.yml
      service: db

  backend:
    depends_on:
      - db
      - redis-db
    extends:
      file: ./services/backend.yml
      service: backend
    image: ghcr.io/blockscout/blockscout:11.0.0
    links:
      - db:database
    environment:
        ETHEREUM_JSONRPC_HTTP_URL: http://host.docker.internal:8545/
        ETHEREUM_JSONRPC_TRACE_URL: http://host.docker.internal:8545/
        ETHEREUM_JSONRPC_WS_URL: ws://host.docker.internal:8545/
        CHAIN_ID: '49406'
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # nft_media_handler: removed 2026-08-22.
  #
  # It never started once. It needs NFT_MEDIA_HANDLER_NODES_MAP, which was
  # never set, and object storage for the thumbnails, which was never
  # provisioned (every NFT_MEDIA_HANDLER_AWS_* is still commented out in
  # envs/common-blockscout.env). So it crashed on boot and `restart: always`
  # started it again, 4,710 times, each one a fresh BEAM VM burning ~85% of a
  # core on a four-core host.
  #
  # Nothing depended on it: the explorer's NFT pages and the wallet's NFT tab
  # read image URLs straight from the v2 API, and thumbnails were the only
  # thing this produced. Bringing it back means provisioning a bucket first,
  # then NFT_MEDIA_HANDLER_NODES_MAP, and only then this service.

  visualizer:
    extends:
      file: ./services/visualizer.yml
      service: visualizer

  sig-provider:
    extends:
      file: ./services/sig-provider.yml
      service: sig-provider

  frontend:
    depends_on:
      - backend
    extends:
      file: ./services/frontend.yml
      service: frontend

  stats-db-init:
    extends:
      file: ./services/stats.yml
      service: stats-db-init

  stats-db:
    depends_on:
      stats-db-init:
        condition: service_completed_successfully
    extends:
      file: ./services/stats.yml
      service: stats-db

  stats:
    depends_on:
      - stats-db
      - backend
    extends:
      file: ./services/stats.yml
      service: stats

  # user-ops-indexer: removed 2026-08-22.
  #
  # An ERC-4337 indexer on a chain with no account abstraction. eth_getCode on
  # the canonical v0.6 EntryPoint (0x5ff137d4b0fdcd49dca30c7cf57e578a026d2789)
  # returns 0x on Cyberia — the contract is not deployed, so there has never
  # been a user operation to index.
  #
  # It could not have connected even if there were. It wants a WebSocket
  # (ws://host.docker.internal:8545/) and polygon-edge answers the upgrade with
  # a plain 200 instead of 101, which is the literal text of its crash:
  # `Error: HTTP error: 200 OK`. 1,088 restarts.

  proxy:
    depends_on:
      - backend
      - frontend
      - stats
    extends:
      file: ./services/nginx.yml
      service: proxy

  certbot:
    image: certbot/certbot
    volumes:
      - /root/certbot/conf:/etc/letsencrypt
      - /root/certbot/www:/var/www/certbot

  cyberia_church:
    build: /root/singularity/backend/laravel
    container_name: cyberia_church
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - /root/singularity/backend/laravel:/var/www/html
      - /root/singularity:/singularity
      - /root/.config/solana:/solana
    command: >
      sh -lc "if [ ! -f vendor/autoload.php ]; then
        composer install --no-interaction --prefer-dist --no-progress;
      fi &&
      php artisan storage:link --relative --force &&
      php artisan serve --host=0.0.0.0 --port=9001"
    ports:
      - "9001:9001"
    env_file:
      - /root/singularity/backend/laravel/.env

  polygon-edge:
    image: 0xpolygon/polygon-edge:latest
    container_name: polygon-edge
    restart: unless-stopped
    user: "0:0"
    volumes:
      - /root/polygon-edge-validators:/data
      - /root/id/docker/polygon-edge/genesis.json:/genesis.json:ro
    ports:
      - "8545:8545"
      - "8546:8546"
      - "1337:1337"
    environment:
      - POLYGON_EDGE_DATA_DIR=/data
    command: >
      server
      --data-dir=/data
      --chain=/genesis.json
      --jsonrpc=0.0.0.0:8545
      --access-control-allow-origins=*
      --json-rpc-block-range-limit=1000
      --block-gas-target=0x1C9C380
      --libp2p=0.0.0.0:1337
      --seal
      --price-limit=1000000000

  ipfs:
    image: ipfs/kubo:latest
    container_name: ipfs
    restart: unless-stopped
    environment:
      # Disable mDNS/local discovery — appropriate for a datacenter node.
      - IPFS_PROFILE=server
    volumes:
      - ipfs-data:/data/ipfs
      # Kubo runs scripts in /container-init.d/ once, after `ipfs init`,
      # before the daemon starts. Used here to open the API to siblings.
      - ./ipfs/001-bind-api.sh:/container-init.d/001-bind-api.sh:ro
    ports:
      # libp2p swarm — peer connectivity, must be reachable for content to
      # propagate to public gateways (e.g. ipfs.io).
      - "4001:4001"
      - "4001:4001/udp"
      # Kubo API (pinning). Bound to localhost on the host so it is NOT exposed
      # publicly; sibling containers reach it in-network at http://ipfs:5001.
      - "127.0.0.1:5001:5001"
      # Read gateway, localhost only — handy for debugging pinned content.
      # Host port 8080 is taken by the Blockscout proxy (services/nginx.yml),
      # so it is published on 8881 here; the container still serves on 8080.
      # NOTE: 8881 is host-only. Sibling containers reach the gateway at
      # http://ipfs:8080 and the API (for pinning) at http://ipfs:5001.
      - "127.0.0.1:8881:8080"

volumes:
  ipfs-data:
