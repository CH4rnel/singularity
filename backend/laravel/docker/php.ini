; The image ships no php.ini at all, so PHP falls back to its compiled
; defaults: upload_max_filesize=2M, post_max_size=8M. The console's room
; promises 25 MB a file — and a promise the stack under it cannot keep is a
; 413 from the proxy or, worse, an upload PHP drops in silence.
;
; post_max_size covers both supported batches: chat accepts five 25 MB files,
; while a task accepts eight 5 MB files. The larger contract sets this shared
; PHP runtime ceiling; each controller still enforces its own per-file limit.
upload_max_filesize = 25M
post_max_size = 128M
max_file_uploads = 10

; Reading a 25 MB upload and a Vite manifest in the same request is more than
; the default 128M leaves room for.
memory_limit = 256M
