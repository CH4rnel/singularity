<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#0b0f10" />
        <title>Cyberia is offline</title>
        <style>
            :root {
                color-scheme: dark;
                font-family:
                    Manrope,
                    ui-sans-serif,
                    system-ui,
                    -apple-system,
                    BlinkMacSystemFont,
                    'Segoe UI',
                    sans-serif;
                background: #0b0f10;
                color: #eef7f6;
            }

            * {
                box-sizing: border-box;
            }

            body {
                min-height: 100vh;
                margin: 0;
                display: grid;
                place-items: center;
                padding: 24px;
                background:
                    radial-gradient(
                        circle at 50% 20%,
                        rgb(0 229 209 / 12%),
                        transparent 35%
                    ),
                    #0b0f10;
            }

            main {
                width: min(100%, 430px);
                padding: 32px;
                border: 1px solid rgb(0 229 209 / 35%);
                border-radius: 18px;
                background: rgb(13 20 21 / 92%);
                box-shadow: 0 24px 80px rgb(0 0 0 / 45%);
                text-align: center;
            }

            svg {
                width: 72px;
                height: 72px;
                margin-bottom: 20px;
            }

            h1 {
                margin: 0 0 12px;
                font-size: clamp(24px, 8vw, 34px);
                letter-spacing: -0.035em;
            }

            p {
                margin: 0 0 24px;
                color: #a7b8b6;
                line-height: 1.6;
            }

            a {
                display: inline-flex;
                min-height: 44px;
                align-items: center;
                justify-content: center;
                padding: 0 20px;
                border-radius: 9px;
                background: #00e5d1;
                color: #07100f;
                font-weight: 800;
                text-decoration: none;
            }
        </style>
    </head>
    <body>
        <main>
            <svg
                viewBox="0 0 64 64"
                role="img"
                aria-label="Cyberia"
                xmlns="http://www.w3.org/2000/svg"
            >
                <rect width="64" height="64" rx="12" fill="#0b0f10" />
                <g
                    fill="none"
                    stroke="#00e5d1"
                    stroke-width="3.4"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <path
                        d="M32 10 51 20.75v21.5L32 53 13 42.25v-21.5L32 10Z"
                    />
                    <path d="M13 20.75 32 31.5l19-10.75" />
                    <path d="M32 31.5V53" />
                </g>
            </svg>
            <h1>You are outside the Wired.</h1>
            <p>
                Cyberia cannot reach the network right now. Check your
                connection and try opening the app again.
            </p>
            <a href="/">Try again</a>
        </main>
    </body>
</html>
